name: Publish to NPM

on: workflow_dispatch

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          repository: membrane-io/mnode
          token: ${{ secrets.GITHUB }}

      - name: Determine version
        id: version
        run: |
          cd mctl
          echo "VERSION=$(cat Cargo.toml | grep -E '^version *= *".*' | awk '{print $3}' | tr -d '"')" >> "$GITHUB_OUTPUT"

      - name: Verify Cargo Version
        run: |
          tag_version="${{ steps.version.outputs.VERSION }}"
          cargo_version=$(cat mctl/Cargo.toml | grep -E '^version *= *".*' | awk '{print $3}' | tr -d '"')

          if [ "$tag_version" != "$cargo_version" ]; then
            echo "Tag version ($tag_version) and Cargo.toml version ($cargo_version) do not match. Aborting the workflow."
            exit 1
          fi
      
      - name: Verify if release exists
        id: release_exists
        run: |
          existing_tags=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/membrane-io/mnode/tags")
          tag_version="${{ steps.version.outputs.VERSION }}"
          tag_exists=false
          for tag in $(echo "$existing_tags" | jq -r '.[].name'); do
            if [ "$tag" = "$tag_version" ]; then
              tag_exists=true
              break
            fi
          done
          if [ "$tag_exists" = true ]; then
            echo "Release $tag_version already exists. Aborting the workflow."
            exit 1
          fi

      - name: Download Linux x86 artifact
        uses: bettermarks/action-artifact-download@0.3.0
        with:
          repo: membrane-io/mnode
          token: ${{ secrets.GITHUB }}
          artifact_name: mctl-${{steps.version.outputs.VERSION}}-linux-x86.zip

      - name: Download MacOS x86 artifact
        uses: bettermarks/action-artifact-download@0.3.0
        with:
          repo: membrane-io/mnode
          token: ${{ secrets.GITHUB }}
          artifact_name: mctl-${{steps.version.outputs.VERSION}}-macos-x86.zip

      - name: Download MacOS Arm artifact
        uses: bettermarks/action-artifact-download@0.3.0
        with:
          repo: membrane-io/mnode
          token: ${{ secrets.GITHUB }}
          artifact_name: mctl-${{steps.version.outputs.VERSION}}-macos-arm.zip

      - name: Download Windows artifact
        uses: bettermarks/action-artifact-download@0.3.0
        with:
          repo: membrane-io/mnode
          token: ${{ secrets.GITHUB }}
          artifact_name: mctl-${{steps.version.outputs.VERSION}}-windows.zip

      - name: Unzip zips
        run: |
          mkdir -p out
          unzip mctl-${{steps.version.outputs.VERSION}}-linux-x86.zip -d out/
          unzip mctl-${{steps.version.outputs.VERSION}}-macos-x86.zip -d out/
          unzip mctl-${{steps.version.outputs.VERSION}}-macos-arm.zip -d out/
          unzip mctl-${{steps.version.outputs.VERSION}}-windows.zip -d out/
          ls out

      # Setup for NPM publishing
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          registry-url: 'https://registry.npmjs.org'

      - name: Create NPM package structure
        run: |
          mkdir -p npm-package/bin
          # Move binaries to the proper locations with correct names
          cp out/mctl-${{steps.version.outputs.VERSION}}-linux-x86/mctl npm-package/bin/mctl-linux
          cp out/mctl-${{steps.version.outputs.VERSION}}-macos-x86/mctl npm-package/bin/mctl-macos
          cp out/mctl-${{steps.version.outputs.VERSION}}-macos-arm/mctl npm-package/bin/mctl-macos-arm64
          cp out/mctl-${{steps.version.outputs.VERSION}}-windows/mctl.exe npm-package/bin/mctl.exe
          chmod +x npm-package/bin/*

      - name: Create package.json
        run: |
          cat > npm-package/package.json << EOL
          {
            "name": "@membrane/mctl",
            "version": "${{ steps.version.outputs.VERSION }}",
            "description": "Membrane Control CLI tool",
            "bin": {
              "mctl": "index.js"
            },
            "files": [
              "bin/",
              "index.js"
            ],
            "engines": {
              "node": ">=12"
            },
            "os": [
              "darwin",
              "linux",
              "win32"
            ],
            "repository": {
              "type": "git",
              "url": "git+https://github.com/membrane-io/mnode.git"
            },
            "author": "Membrane",
            "license": "MIT",
            "bugs": {
              "url": "https://github.com/membrane-io/mnode/issues"
            },
            "homepage": "https://github.com/membrane-io/mnode#readme"
          }
          EOL

      - name: Create entry point script
        run: |
          cat > npm-package/index.js << 'EOL'
          #!/usr/bin/env node

          const { spawnSync } = require('child_process');
          const path = require('path');
          const fs = require('fs');
          const os = require('os');

          // Determine platform and architecture
          const platform = os.platform();
          const arch = os.arch();
          
          let binPath;
          
          if (platform === 'win32') {
            binPath = path.join(__dirname, 'bin', 'mctl.exe');
          } else if (platform === 'darwin') {
            if (arch === 'arm64') {
              binPath = path.join(__dirname, 'bin', 'mctl-macos-arm64');
            } else {
              binPath = path.join(__dirname, 'bin', 'mctl-macos');
            }
          } else if (platform === 'linux') {
            binPath = path.join(__dirname, 'bin', 'mctl-linux');
          } else {
            console.error(`Unsupported platform: ${platform}`);
            process.exit(1);
          }
          
          // Make sure the binary exists and is executable
          try {
            fs.accessSync(binPath, fs.constants.X_OK);
          } catch (err) {
            console.error(`Cannot execute binary at ${binPath}: ${err.message}`);
            process.exit(1);
          }
          
          // Execute the binary with all arguments passed through
          const result = spawnSync(binPath, process.argv.slice(2), { stdio: 'inherit' });
          
          process.exit(result.status);
          EOL
          
          chmod +x npm-package/index.js

      - name: Publish to NPM
        run: |
          cd npm-package
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Optional: Create GitHub release as well
      - name: Compute SHA256
        run: sha256sum out/mctl-*.zip > sha256.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v1
        with:
          name: "Membrane mctl"
          tag_name: ${{steps.version.outputs.VERSION}}
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            out/mctl-${{steps.version.outputs.VERSION}}-*.zip
            sha256.txt
            